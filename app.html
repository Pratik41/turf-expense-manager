<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSCC - Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #059669, #7c3aed);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 24px; }

        .header-right { display: flex; gap: 15px; align-items: center; }
        .user-info { text-align: right; }
        .user-name { font-weight: 600; }

        .btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-danger { background: #dc2626; color: white; }

        .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }

        .tabs { display: flex; gap: 10px; border-bottom: 2px solid #e2e8f0; margin-bottom: 30px; }
        .tab-btn { padding: 10px 16px; background: transparent; border: none; cursor: pointer; font-weight: 600; color: #64748b; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #059669; border-bottom-color: #059669; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 30px; }

        .stat { background: linear-gradient(135deg, #059669, #047857); color: white; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 32px; font-weight: 700; }
        .stat-label { font-size: 12px; margin-top: 8px; }

        .card { background: white; border-radius: 12px; padding: 20px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .card h3 { margin-bottom: 16px; }

        .success { background: #f0fdf4; color: #15803d; padding: 16px; border-radius: 8px; border-left: 4px solid #22c55e; }
    </style>
</head>
<body>
    <header>
        <h1><i class="fas fa-futbol"></i> KSCC</h1>
        <div class="header-right">
            <div class="user-info">
                <div class="user-name" id="userName">Admin User</div>
            </div>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
            <button class="tab-btn" onclick="switchTab('wallet')">Wallet</button>
            <button class="tab-btn" onclick="switchTab('members')">Members</button>
        </div>

        <section id="dashboard" class="tab-content active">
            <div class="grid">
                <div class="stat">
                    <div class="stat-value">₹0</div>
                    <div class="stat-label">Total Balance</div>
                </div>
                <div class="stat" style="background: linear-gradient(135deg, #7c3aed, #6d28d9);">
                    <div class="stat-value">1</div>
                    <div class="stat-label">Members</div>
                </div>
            </div>
            <div class="success">
                <strong>✅ Welcome!</strong> You are logged in as Admin.
            </div>
        </section>

        <section id="wallet" class="tab-content">
            <div class="card">
                <h3>💰 Your Wallet</h3>
                <p>Balance: <strong>₹0</strong></p>
            </div>
        </section>

        <section id="members" class="tab-content">
            <div class="card">
                <h3>👥 Members</h3>
                <p>No members yet</p>
            </div>
        </section>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('kscc_currentUser'));
        if (!user) {
            window.location.href = 'login.html';
        }

        document.getElementById('userName').textContent = user.firstName + ' ' + user.lastName;

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        function logout() {
            if (confirm('Logout?')) {
                localStorage.removeItem('kscc_currentUser');
                window.location.href = 'login.html';
            }
        }

        console.log('✅ Dashboard loaded!');
    </script>
</body>
</html>
