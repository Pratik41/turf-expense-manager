<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSCC - Professional Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Segoe UI, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); color: #e2e8f0; min-height: 100vh; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 20% 50%, rgba(34, 197, 94, 0.08) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 50%); animation: bgShift 20s ease infinite; z-index: 0; pointer-events: none; }
        @keyframes bgShift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(80px, 80px); } }
        .main { position: relative; z-index: 1; }
        header { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(51, 65, 85, 0.5); padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-right { display: flex; gap: 20px; align-items: center; }
        .user-name { font-weight: 600; }
        .user-role { font-size: 12px; color: #94a3b8; }
        .btn-logout { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        .tabs { display: flex; gap: 15px; margin-bottom: 30px; border-bottom: 1px solid rgba(51, 65, 85, 0.5); }
        .tab-btn { padding: 10px 16px; background: transparent; border: none; cursor: pointer; font-weight: 600; color: #94a3b8; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #10b981; border-bottom-color: #10b981; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(51, 65, 85, 0.5); padding: 24px; border-radius: 14px; }
        .stat:hover { transform: translateY(-5px); }
        .stat-value { font-size: 36px; font-weight: 700; background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-label { font-size: 12px; color: #94a3b8; margin-top: 8px; }
        .card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(51, 65, 85, 0.5); border-radius: 14px; padding: 24px; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 12px; }
        input, select { width: 100%; padding: 10px; background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(51, 65, 85, 0.5); border-radius: 8px; color: #e2e8f0; font-size: 13px; }
        input:focus { outline: none; border-color: #10b981; }
        .btn-primary { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer; margin-top: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(51, 65, 85, 0.3); }
        .success { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 16px; border-radius: 10px; color: #10b981; }
    </style>
</head>
<body>
    <div class="main">
        <header>
            <h1><i class="fas fa-futbol"></i> KSCC Dashboard</h1>
            <div class="header-right">
                <div>
                    <div class="user-name" id="userName">Admin</div>
                    <div class="user-role">Administrator</div>
                </div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </header>
        <div class="container">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
                <button class="tab-btn" onclick="switchTab('members')">Members</button>
                <button class="tab-btn" onclick="switchTab('matches')">Matches</button>
            </div>
            <section id="dashboard" class="tab-content active">
                <div class="grid">
                    <div class="stat"><div class="stat-value">₹0</div><div class="stat-label">Total Pool</div></div>
                    <div class="stat"><div class="stat-value">1</div><div class="stat-label">Members</div></div>
                    <div class="stat"><div class="stat-value">0</div><div class="stat-label">Matches</div></div>
                </div>
                <div class="success">✅ Professional Dashboard Active</div>
            </section>
            <section id="members" class="tab-content">
                <div class="card"><h3>Create Member</h3><input type="text" placeholder="First Name"><input type="text" placeholder="Last Name"><input type="text" placeholder="Mobile"><button class="btn-primary">Create</button></div>
            </section>
            <section id="matches" class="tab-content">
                <div class="card"><h3>Create Match</h3><input type="date"><input type="text" placeholder="Venue"><input type="number" placeholder="Prize"><button class="btn-primary">Create</button></div>
            </section>
        </div>
    </div>
    <script>
        const user = JSON.parse(localStorage.getItem('kscc_currentUser'));
        if (!user) window.location.href = 'login.html';
        else document.getElementById('userName').textContent = user.firstName;
        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
            document.getElementById(t).classList.add('active');
            event.target.classList.add('active');
        }
        function logout() {
            localStorage.clear(); sessionStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
