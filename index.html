<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turf Expense Manager - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
    <div class="container-login">
        <div class="login-card">
            <h1>⚽ Turf Expense Manager</h1>
            <p class="subtitle">Track subscriptions and session splits</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <p class="divider">OR</p>

            <button id="signupToggle" class="btn btn-secondary btn-block">Create Account</button>

            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>

    <!-- Sign Up Modal -->
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Create Account</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" name="name" required>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" name="email" required>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password (min 6 chars)</label>
                    <input type="password" id="signupPassword" name="password" minlength="6" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
            </form>

            <div id="signupError" class="error-message"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Initialize auth page after Firebase loads
        document.addEventListener('DOMContentLoaded', function() {
            // Check if Firebase loaded
            if (typeof firebase === 'undefined') {
                alert('Firebase SDK failed to load. Please refresh the page and check your internet connection.');
                return;
            }

            const modal = document.getElementById('signupModal');
            const signupToggle = document.getElementById('signupToggle');
            const closeBtn = document.querySelector('.close');

            signupToggle.addEventListener('click', () => {
                modal.style.display = 'block';
            });

            closeBtn.addEventListener('click', () => {
                modal.style.display = 'none';
            });

            window.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });

            // Handle login
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                    window.location.href = 'app.html';
                } catch (error) {
                    document.getElementById('errorMessage').textContent = error.message;
                }
            });

            // Handle signup
            document.getElementById('signupForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('signupName').value;
                const email = document.getElementById('signupEmail').value;
                const password = document.getElementById('signupPassword').value;

                try {
                    const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                    const uid = userCredential.user.uid;

                    // Determine if first user (admin)
                    const usersSnapshot = await firebase.firestore().collection('users').get();
                    const isFirstUser = usersSnapshot.size === 0;

                    // Create user document
                    await firebase.firestore().collection('users').doc(uid).set({
                        email,
                        name,
                        role: isFirstUser ? 'admin' : 'member',
                        createdAt: new Date(),
                    });

                    // Create member document
                    await firebase.firestore().collection('members').add({
                        email,
                        name,
                        currentBalance: 0,
                        status: 'active',
                        createdAt: new Date(),
                    });

                    alert(`Account created! Role: ${isFirstUser ? 'ADMIN' : 'MEMBER'}`);
                    modal.style.display = 'none';
                    window.location.href = 'app.html';
                } catch (error) {
                    document.getElementById('signupError').textContent = error.message;
                }
            });

            // Redirect if already logged in
            firebase.auth().onAuthStateChanged((user) => {
                if (user) {
                    window.location.href = 'app.html';
                }
            });
        });
    </script>
</body>
</html>
