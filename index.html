<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSCC - Test Version</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --secondary: #7c3aed;
            --bg: #ffffff;
            --bg-light: #f8fafc;
            --text: #1e293b;
            --text-light: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo { font-size: 48px; text-align: center; margin-bottom: 10px; }
        h1 { text-align: center; color: var(--primary); margin-bottom: 5px; font-size: 28px; }
        p { text-align: center; color: var(--text-light); margin-bottom: 30px; font-size: 14px; }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
        input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(5,150,105,0.1); }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .btn-primary:active { transform: translateY(0); }

        .info { background: #f0f4f8; padding: 12px; border-radius: 8px; margin-top: 20px; font-size: 12px; color: var(--text); }

        #appSection { display: none; padding: 20px; }
        .dashboard { background: white; padding: 20px; border-radius: 12px; }
        h2 { color: var(--primary); margin-bottom: 20px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 16px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: 700; }
        .stat-label { font-size: 12px; opacity: 0.9; }
        .btn-logout { background: #dc2626; color: white; }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginSection" class="login-container">
        <div class="logo">⚽</div>
        <h1>KSCC</h1>
        <p>Cricket Club Management</p>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="admin">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="AdminUser9999">
        </div>

        <button class="btn btn-primary" onclick="handleLogin()">
            <i class="fas fa-sign-in-alt"></i> Login
        </button>

        <div class="info">
            <strong>Test Credentials:</strong><br>
            Username: <code>admin</code><br>
            Password: <code>AdminUser9999</code>
        </div>
    </div>

    <!-- APP -->
    <div id="appSection">
        <div class="dashboard">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Dashboard</h2>
                <button class="btn btn-logout" onclick="handleLogout()">Logout</button>
            </div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-value">₹0</div>
                    <div class="stat-label">Balance</div>
                </div>
                <div class="stat">
                    <div class="stat-value">0</div>
                    <div class="stat-label">Matches</div>
                </div>
                <div class="stat">
                    <div class="stat-value">0</div>
                    <div class="stat-label">Members</div>
                </div>
            </div>

            <div style="background: #f0fdf4; padding: 16px; border-radius: 8px; color: #15803d; border-left: 4px solid #22c55e;">
                <strong>✅ Login Successful!</strong><br>
                Welcome, <span id="userDisplay">Admin</span>!
            </div>
        </div>
    </div>

    <script>
        // Simple database
        const database = {
            users: [
                {
                    id: 1,
                    username: 'admin',
                    password: 'AdminUser9999',
                    firstName: 'Admin',
                    lastName: 'User',
                    isAdmin: true
                }
            ]
        };

        let currentUser = null;

        function handleLogin() {
            console.log('🔵 Login button clicked');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            console.log('📝 Input values:', { username, password });
            console.log('🔍 Database users:', database.users);

            // Find matching user
            const user = database.users.find(u => u.username === username && u.password === password);

            if (!user) {
                console.log('❌ No matching user found');
                alert('❌ Invalid credentials\n\nUsername: admin\nPassword: AdminUser9999');
                return;
            }

            console.log('✅ User found:', user);

            // Set current user
            currentUser = user;

            // Show app section
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            document.getElementById('userDisplay').textContent = user.firstName + ' ' + user.lastName;

            console.log('✅ Login successful!');
        }

        function handleLogout() {
            console.log('🔴 Logout clicked');
            currentUser = null;
            document.getElementById('appSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            console.log('✅ Logged out');
        }

        // Auto-focus on load
        window.addEventListener('load', function() {
            console.log('🚀 Page loaded');
            console.log('📊 Database initialized with users:', database.users);
            document.getElementById('username').focus();
        });
    </script>
</body>
</html>
